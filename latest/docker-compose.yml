services:
  mzdev-test:
    image: hwport/ubuntu:latest
    container_name: mzdev-test
    hostname: mzdev-test
    stdin_open: true
    tty: true
#    privileged: true
#    cap_add:
#      - "SYS_ADMIN"
#      - "SYS_RESOURCE"
#      - "SYS_PTRACE"
#      - "NET_ADMIN"
#      - "NET_BIND_SERVICE"
#      - "NET_BROADCAST"
#      - "NET_RAW"
#      - "BPF" # >= Linux Kernel v5.8
    environment:
      - container=docker
      - TZ=Asia/Seoul
      - TERM=xterm
      - LC_ALL=C
      - LANG=ko_KR.UTF-8
      - EDITOR=vim
      - INIT_USER=dev
      - INIT_USER_PASSWORD=password
#      - INIT_USER_COMMENT=Developer
#      - INIT_USER_GROUP=users
#      - INIT_USER_GROUPS=users,adm,sudo,docker
#      - INIT_USER_SHELL=/bin/bash
      - CLAMAV=yes
      - XRDP_DESKTOP=yes
      - SHELLINABOX=yes
      # NVIDIA GPU (권장): 호스트의 nvidia-container-toolkit이 실행 환경 GPU(구형~신형)에
      # 맞는 호스트 드라이버를 주입한다. 호스트가 default-runtime=nvidia (또는 CDI)로
      # 설정되어 있으면 아래 두 환경변수만으로 GPU가 활성화된다.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
