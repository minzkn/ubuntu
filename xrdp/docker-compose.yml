services:
  xrdp:
    image: hwport/ubuntu:xrdp
    container_name: xrdp
    hostname: xrdp
    stdin_open: true
    tty: true
    environment:
      - container=docker
      - TZ=Asia/Seoul
      - TERM=xterm
      - LC_ALL=C
      - LANG=en_US.UTF-8
      - EDITOR=vim
      - INIT_USER=dev
      - INIT_USER_PASSWORD=password
      # NVIDIA GPU (권장): 호스트의 nvidia-container-toolkit이 실행 환경 GPU(구형~신형)에
      # 맞는 호스트 드라이버를 주입한다. default-runtime=nvidia (또는 CDI) 설정 시 활성화.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: all
#              capabilities: [gpu,utility,compute,video,graphics,display]
#      # 위 deploy 블록은 default-runtime=nvidia가 아닌 호스트에서 참고용 (GPU 없으면 실패).
#      - INIT_USER_COMMENT=Developer
#      - INIT_USER_GROUP=users
#      - INIT_USER_GROUPS=users,adm,sudo
#      - INIT_USER_SHELL=/bin/bash
        #    volumes:
        #      - /sys/fs/cgroup:/sys/fs/cgroup:ro
        #    tmpfs:
        #      - /tmp
        #      - /run
        #      - /run/lock
        #    networks:
        #      - default
        #    network_mode: bridge
    network_mode: bridge
    ports:
      - "3389:3389"
    restart: unless-stopped

# End of docker-compose.yml
